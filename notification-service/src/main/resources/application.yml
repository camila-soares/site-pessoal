spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:h2:mem:notificationdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:}
    password: ${MAIL_PASS:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

server:
  port: 8082

notification:
  from-email: ${NOTIFICATION_FROM:noreply@camila.dev}
  dev-mode: ${NOTIFICATION_DEV_MODE:true}   # true = loga em vez de enviar

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    com.camila.notification: DEBUG
